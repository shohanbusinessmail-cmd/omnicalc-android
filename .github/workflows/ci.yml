name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Lint, Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace test

      - name: Lint
        if: always()
        run: ./gradlew --no-daemon --stacktrace lint

      - name: Debug build
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results*
            **/build/outputs/**/*.apk
          if-no-files-found: warn
          retention-days: 14

  release-artifacts:
    name: Release artifacts (unsigned)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK + App Bundle (unsigned)
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Checksums
        run: |
          mkdir -p dist
          find app/build/outputs -name '*.apk' -o -name '*.aab' | while read f; do cp "$f" dist/; done
          cd dist && sha256sum * > SHA256SUMS.txt && ls -la

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 30
