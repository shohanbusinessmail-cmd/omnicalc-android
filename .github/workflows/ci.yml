name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, Lint, Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        shell: bash
        run: ./gradlew --no-daemon --stacktrace test 2>&1 | tee gradle-test.log

      - name: Lint
        if: always()
        shell: bash
        run: ./gradlew --no-daemon --stacktrace lint 2>&1 | tee gradle-lint.log

      - name: Debug build
        shell: bash
        run: ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee gradle-assemble.log

      # Surface the actual Gradle errors as annotations (readable via the
      # GitHub API from the sandbox, unlike raw logs/artifacts).
      - name: Annotate Gradle failures
        if: failure()
        shell: bash
        run: |
          annotate() {
            local f="$1"
            [ -f "$f" ] || return 0
            grep -E "(^e: |error:|FAILURE:|What went wrong|Execution failed|Caused by:|> Task .* FAILED|expected|FAILED$)" "$f" \
              | head -35 \
              | while IFS= read -r line; do
                  esc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
                  echo "::error title=Gradle (${f})::${esc}"
                done
            tailctxt=$(tail -n 25 "$f" | tr '\n' '|' | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
            echo "::error title=Tail of ${f}::${tailctxt}"
          }
          annotate gradle-test.log
          annotate gradle-lint.log
          annotate gradle-assemble.log

      # The sandbox cannot fetch Actions logs from the results-receiver host,
      # so failures are surfaced through the job summary (github.com) and
      # through uploaded log artifacts (api.github.com).
      - name: Publish failure details to job summary
        if: failure()
        run: |
          for f in gradle-test.log gradle-lint.log gradle-assemble.log; do
            [ -f "$f" ] || continue
            {
              echo "### $f (last 250 lines)"
              echo '```'
              tail -n 250 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-output
          path: |
            gradle-*.log
            **/build/reports/**
            **/build/outputs/**/*.apk
          if-no-files-found: warn
          retention-days: 14

  release-artifacts:
    name: Release artifacts (unsigned)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble release APK + App Bundle (unsigned)
        shell: bash
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease 2>&1 | tee gradle-release.log

      - name: Publish failure details to job summary
        if: failure()
        run: |
          {
            echo "### gradle-release.log (last 250 lines)"
            echo '```'
            tail -n 250 gradle-release.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checksums
        run: |
          mkdir -p dist
          find app/build/outputs -name '*.apk' -o -name '*.aab' | while read f; do cp "$f" dist/; done
          cd dist && sha256sum * > SHA256SUMS.txt && ls -la

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 30
